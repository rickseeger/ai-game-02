[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "citywalk2d"
version = "0.1.0"
description = "A 2D top-down color-ASCII city-walk game (stdlib only)"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = []

[project.scripts]
citywalk2d = "citywalk2d.__main__:main"

[tool.setuptools.packages.find]
include = ["citywalk2d*"]
