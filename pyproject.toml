[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "citywalk"
version = "0.1.0"
description = "A first-person color-ASCII night-city walkthrough (stdlib only)"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
citywalk = "citywalk.__main__:main"

[tool.setuptools.packages.find]
include = ["citywalk*"]
