name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run test suite
        run: python -m unittest discover -s tests

  package-windows:
    name: Build Windows exe
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Build one-file exe
        run: pyinstaller --clean --noconfirm citywalk.spec
      - name: Smoke test the exe (headless)
        run: .\dist\citywalk.exe --snapshot --width 80 --height 24
      - uses: actions/upload-artifact@v4
        with:
          name: citywalk-windows-x86_64
          path: dist/citywalk.exe
